manifest_version: 2

artifacts:
  setup_script: setup_script.sql
  readme: readme.md
  container_services:
    images:
      - /worldcup_pool/provider/images/worldcup-pool:v1

privileges:
  - CREATE COMPUTE POOL:
      description: "Required to run the prediction pool web UI"
  - CREATE WAREHOUSE:
      description: "Required for scoring computations"
  - BIND SERVICE ENDPOINT:
      description: "Required to expose the web UI via public URL"

references:
  - consumer_warehouse:
      label: "Warehouse for queries"
      description: "A warehouse used for running scoring and leaderboard queries"
      privileges:
        - USAGE
      object_type: WAREHOUSE
      register_callback: config.register_reference
